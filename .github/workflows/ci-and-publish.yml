name: CI & npm Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify Build, Types, Vite & Hermetic npm Pack
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install FFmpeg & Remotion headless browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libatspi2.0-0t64 \
            libasound2t64 \
            libcups2t64 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxkbcommon0 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: npm ci

      - name: Build publishable packages
        run: npm run build:packages

      - name: Run unit & lockfile sync tests
        run: npm test

      - name: Typecheck workspace
        run: npm run typecheck

      - name: Build Studio Web
        run: npx vite build

      - name: End-to-end hermetic npm pack & consumer verification
        run: npm run pack:verify

  publish:
    name: Publish @make-pictures/* & create-make-pictures to npm
    runs-on: ubuntu-24.04
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 for npmjs.org
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish packages in topological order with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
